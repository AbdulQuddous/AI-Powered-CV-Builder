<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'">
<meta name="cv-page-count" content="{{ page_count }}"><title>CV · {{ page_count }} PDF page{{ page_count|pluralize }}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8edf3;color:#334155;font:13px Arial,sans-serif}.document-status{position:sticky;top:0;z-index:1;padding:12px 16px;background:#f8fafcf2;border-bottom:1px solid #cbd5e1;text-align:center}.pages{width:100%;max-width:min(850px,calc((100vh - 160px)*.7071 + 48px));margin:auto;padding:20px 24px}.pdf-page{margin:0 0 26px}.pdf-page figcaption{padding:0 0 8px;font-size:12px}.pdf-page img{display:block;width:100%;height:auto;background:#fff;box-shadow:0 3px 15px #1e293b24}.page-text{margin:7px 0 0;font-size:11px}.page-text pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:12px;font:12px/1.5 Arial,sans-serif}@media(max-width:600px){.pages{padding:12px 8px}.document-status{font-size:11px}}
#fit-width:checked~.pages{max-width:850px}.zoom-choice{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.document-status label{display:inline-block;padding:3px 8px;margin-left:7px;border:1px solid #cbd5e1;border-radius:4px;cursor:pointer}#fit-page:checked~.document-status label[for="fit-page"],#fit-width:checked~.document-status label[for="fit-width"]{background:#dbe9e6;border-color:#0f766e;color:#115e59}.zoom-choice:focus-visible~.document-status{outline:2px solid #0f766e}
</style></head><body><input class="zoom-choice" id="fit-page" name="zoom" type="radio" checked><input class="zoom-choice" id="fit-width" name="zoom" type="radio"><header class="document-status">{{ page_count }} A4 page{{ page_count|pluralize }} · Actual PDF layout · All pages shown <label for="fit-page">Fit page</label><label for="fit-width">Fit width</label></header>
<main class="pages" data-page-count="{{ page_count }}">{% for page in pages %}<figure class="pdf-page" data-page="{{ page.number }}"><figcaption>Page {{ page.number }} of {{ page_count }}</figcaption><img src="{{ page.image_url }}" alt="CV page {{ page.number }} of {{ page_count }}; actual PDF rendering" loading="{% if forloop.first %}eager{% else %}lazy{% endif %}"><details class="page-text"><summary>Read page text</summary><pre>{{ page.text }}</pre></details></figure>{% endfor %}</main></body></html>
